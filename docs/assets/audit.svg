<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sample TOKENMAXXING audit output</title>
  <desc id="desc">Rounded usage and work-ledger results from one machine over 30 days. Usage per passing check is 1.8 million weighted units.</desc>
  <rect width="1200" height="700" fill="#0B0D10"/>
  <rect x="24" y="24" width="1152" height="572" rx="10" fill="#101318" stroke="#30363D" stroke-width="1.5"/>
  <path d="M34 24h1132a10 10 0 0 1 10 10v50H24V34a10 10 0 0 1 10-10z" fill="#171B21"/>
  <path d="M24 84h1152" stroke="#30363D"/>
  <circle cx="55" cy="54" r="6" fill="#8A8F98"/>
  <circle cx="78" cy="54" r="6" fill="#8A8F98" opacity=".68"/>
  <circle cx="101" cy="54" r="6" fill="#8A8F98" opacity=".38"/>
  <text x="600" y="59" text-anchor="middle" fill="#8A8F98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">tokenmaxxing audit --since 30d</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-variant-numeric="tabular-nums">
    <text x="76" y="139" fill="#E8E6E1" font-size="22" font-weight="650">TOKENMAXXING audit — last 30d</text>
    <text x="76" y="202" fill="#E8E6E1">Claude Code: 50 sessions, 190 subagent runs, 11k API turns</text>
    <text x="76" y="242" fill="#C6C8CC">fresh input 380k · cache read 2.9B · cache write 77M · output 6.5M</text>
    <text x="76" y="282" fill="#C6C8CC">cache hit rate 97% · weighted cost units 450M</text>
    <text x="76" y="322" fill="#C6C8CC">cache rebuilds: 140 (35M tokens)</text>
    <path d="M76 354h1048" stroke="#30363D" stroke-width="1"/>
    <text x="76" y="400" fill="#8A8F98" font-size="17">Work (proxy — counted from tool calls, not a quality judgement)</text>
    <text x="76" y="446" fill="#C6C8CC">edits 1.3k · checks 300 (270 passed, 30 failed) · commits 90</text>
    <text x="76" y="486" fill="#C6C8CC">rework rate 9% · verified-edit sessions 23/135 (17%)</text>
    <text x="76" y="532"><tspan fill="#8A8F98">usage per passing check </tspan><tspan fill="#3DDC84" font-weight="750">1.8M</tspan><tspan fill="#C6C8CC"> units</tspan></text>
    <text x="76" y="572" fill="#C6C8CC">model mix: premium 87% · standard 12% · economy 0% · unknown 1%</text>
  </g>
</svg>
