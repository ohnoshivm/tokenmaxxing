<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Measure, Fix, Guard, Prove</title>
  <desc id="desc">A four-step operating loop: audit usage and work, review reversible fixes, hold back a cold-cache prompt once, then compare equal windows.</desc>
  <rect width="1200" height="400" fill="#0B0D10"/>
  <rect x="24" y="24" width="1152" height="352" rx="8" fill="none" stroke="#252B32"/>

  <path d="M145 116h909" stroke="#363D46" stroke-width="2"/>
  <g fill="#0B0D10" stroke="#69717C" stroke-width="2">
    <circle cx="145" cy="116" r="8"/>
    <circle cx="448" cy="116" r="8"/>
    <circle cx="751" cy="116" r="8"/>
  </g>
  <circle cx="1054" cy="116" r="10" fill="#3DDC84"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="145" y="181" text-anchor="middle" fill="#E8E6E1" font-size="25" font-weight="700">Measure</text>
    <text x="448" y="181" text-anchor="middle" fill="#E8E6E1" font-size="25" font-weight="700">Fix</text>
    <text x="751" y="181" text-anchor="middle" fill="#E8E6E1" font-size="25" font-weight="700">Guard</text>
    <text x="1054" y="181" text-anchor="middle" fill="#3DDC84" font-size="25" font-weight="700">Prove</text>
    <text x="145" y="257" text-anchor="middle" fill="#8A8F98" font-size="16">Read usage, cache and work.</text>
    <text x="448" y="257" text-anchor="middle" fill="#8A8F98" font-size="16">Review reversible skill moves.</text>
    <text x="751" y="257" text-anchor="middle" fill="#8A8F98" font-size="16">Hold a cold-cache prompt once.</text>
    <text x="1054" y="257" text-anchor="middle" fill="#8A8F98" font-size="16">Compare equal windows.</text>
  </g>
  <g fill="#C6C8CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="145" y="220" text-anchor="middle">audit --since 7d</text>
    <text x="448" y="220" text-anchor="middle">fix</text>
    <text x="751" y="220" text-anchor="middle">guard --hook</text>
    <text x="1054" y="220" text-anchor="middle">audit --compare</text>
  </g>
</svg>
