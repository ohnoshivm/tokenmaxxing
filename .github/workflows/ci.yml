name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check CLI help
        run: python3 tokenmaxxing.py --help
      - name: Check offline dry-run install
        run: python3 tokenmaxxing.py install --dry-run --no-fetch
      - name: Check skill copies match
        run: cmp skills/tokenmaxxing/SKILL.md plugins/tokenmaxxing/skills/tokenmaxxing/SKILL.md
